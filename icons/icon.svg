  <ellipse cx="372" cy="300" rx="20" ry="11" fill="#F49AC1" opacity=".55"/>
  <!-- little hearts & sparkle -->
  <path d="M424 58 c -10 -14 -32 -8 -30 10 c 2 14 18 24 30 32 c 12 -8 28 -18 30 -32 c 2 -18 -20 -24 -30 -10 Z" fill="#E0679A"/>
  <path d="M86 70 l 7 18 l 18 7 l -18 7 l -7 18 l -7 -18 l -18 -7 l 18 -7 Z" fill="#FFFFFF"/>
  <path d="M468 196 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z" fill="#FFFFFF"/>
</svg>
