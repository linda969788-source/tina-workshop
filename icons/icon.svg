<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEAF3"/>
      <stop offset="1" stop-color="#F8C3DA"/>
    </linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEFF5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- polka dots -->
  <g fill="#FFFFFF" opacity=".55">
    <circle cx="70" cy="420" r="10"/><circle cx="440" cy="440" r="14"/><circle cx="455" cy="300" r="7"/><circle cx="52" cy="250" r="7"/>
  </g>
  <!-- big heart -->
  <path d="M256 458 C 120 372 40 290 58 180 C 74 96 180 68 256 150 C 332 68 438 96 454 180 C 472 290 392 372 256 458 Z" fill="#EE9CC0" transform="translate(0 12)"/>
