  <!-- shine -->
  <path d="M110 165 C 118 128 150 112 182 118" fill="none" stroke="#F6B6D1" stroke-width="12" stroke-linecap="round"/>
  <!-- name -->
  <text x="256" y="268" text-anchor="middle" font-family="'Arial Rounded MT Bold','Comic Sans MS','Segoe UI Black',sans-serif" font-weight="700" font-size="104" fill="#4A1A6B">Tina</text>
  <text x="256" y="356" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="800" font-size="70" fill="#4A1A6B" letter-spacing="2">小作坊</text>
  <!-- blush -->
